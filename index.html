<style>
  :root{
    --blue:#3182F6;
    --blue-dark:#1B64DA;
    --blue-tint:#EBF2FE;
    --green:#00C471;
    --green-tint:#E6F9F0;
    --red:#F04452;
    --red-tint:#FDEDEE;
    --orange:#FF8A00;
    --orange-tint:#FFF3E0;
    --gray-900:#191F28;
    --gray-700:#333D4B;
    --gray-500:#8B95A1;
    --gray-300:#B0B8C1;
    --gray-100:#F2F4F6;
    --gray-50:#F9FAFB;
    --white:#FFFFFF;
    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:10px;
    --shadow-card:0 2px 10px rgba(25,31,40,0.05);
    --shadow-pop:0 8px 28px rgba(25,31,40,0.12);
  }
  *{box-sizing:border-box;}
  body{margin:0;}
  .app{
    font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Segoe UI","Malgun Gothic",sans-serif;
    background:var(--gray-50);
    color:var(--gray-900);
    min-height:100%;
    display:flex;
    flex-direction:column;
    letter-spacing:-0.01em;
  }

  /* ---------- top bar ---------- */
  .topbar{
    background:var(--white);
    padding:14px 22px;
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    border-bottom:1px solid var(--gray-100);
  }
  .brand{display:flex;align-items:baseline;gap:8px;margin-right:auto;}
  .brand .tag{
    font-weight:800;color:var(--blue);font-size:12px;
    background:var(--blue-tint);padding:3px 8px;border-radius:20px;
  }
  .brand h1{font-size:17px;margin:0;font-weight:800;letter-spacing:-0.02em;}
  .brand .sub{font-size:12px;color:var(--gray-500);font-weight:500;}
  .progress-pill{
    font-size:12.5px;font-weight:700;color:var(--gray-700);
    background:var(--gray-100);padding:7px 12px;border-radius:20px;
  }
  .topbar button{
    font-family:inherit;font-size:13px;font-weight:700;border:none;
    border-radius:10px;padding:9px 14px;cursor:pointer;
  }
  .btn-ghost{background:var(--gray-100);color:var(--gray-700);}
  .btn-ghost:hover{background:#E8EBEE;}
  .btn-primary{background:var(--blue);color:#fff;}
  .btn-primary:hover{background:var(--blue-dark);}

  /* ---------- layout ---------- */
  .main{flex:1;display:grid;grid-template-columns:320px 1fr;gap:16px;padding:16px;min-height:0;}
  @media (max-width:860px){ .main{grid-template-columns:1fr;} }
  .panel{background:var(--white);box-shadow:var(--shadow-card);border-radius:var(--radius-lg);display:flex;flex-direction:column;min-height:0;}

  /* ---------- roster ---------- */
  .roster-head{padding:12px 14px;border-bottom:1px solid var(--gray-100);display:flex;gap:8px;}
  .roster-head input{
    flex:1;border:none;background:var(--gray-100);border-radius:10px;padding:9px 12px;font-size:13px;font-family:inherit;
  }
  .roster-list{overflow-y:auto;flex:1;padding:6px;}
  .roster-item{
    padding:11px 12px;border-radius:14px;cursor:pointer;margin-bottom:2px;
    display:flex;flex-direction:column;gap:3px;
  }
  .roster-item:hover{background:var(--gray-50);}
  .roster-item.active{background:var(--blue-tint);}
  .roster-item .row1{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;}
  .roster-item .tag{
    font-size:10.5px;font-weight:700;color:var(--gray-500);background:var(--gray-100);
    padding:2px 7px;border-radius:8px;
  }
  .status-dot{width:8px;height:8px;border-radius:50%;background:var(--gray-300);flex-shrink:0;}
  .status-dot.done{background:var(--green);}
  .warn-badge{
    margin-left:auto;font-size:11px;background:var(--orange-tint);color:var(--orange);
    padding:2px 7px;border-radius:8px;font-weight:800;
  }
  .roster-empty{padding:44px 18px;text-align:center;color:var(--gray-500);font-size:13px;line-height:1.7;}
  .roster-item .sid{
    font-size:11px;font-weight:800;color:var(--blue-dark);background:var(--blue-tint);
    padding:2px 7px;border-radius:8px;font-variant-numeric:tabular-nums;letter-spacing:0.02em;
  }
  .group{margin-bottom:4px;}
  .group-head{
    display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;
    border-radius:12px;background:var(--gray-50);margin-bottom:2px;
  }
  .group-head:hover{background:var(--gray-100);}
  .group-arrow{font-size:11px;color:var(--gray-500);width:10px;}
  .group-title{font-size:13.5px;font-weight:800;color:var(--gray-900);}
  .group-count{margin-left:auto;font-size:11.5px;color:var(--gray-500);font-weight:700;}
  .group-body{padding-left:4px;}

  /* ---------- detail ---------- */
  .detail{overflow-y:auto;padding:22px 24px 30px;}
  .detail-empty{display:flex;align-items:center;justify-content:center;height:100%;color:var(--gray-500);font-size:14px;text-align:center;line-height:1.7;padding:60px 20px;}
  .d-head{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap;}
  .d-head .name{font-size:19px;font-weight:800;}
  .d-head .tag{font-size:12px;font-weight:700;color:var(--gray-500);background:var(--gray-100);padding:4px 9px;border-radius:9px;}
  .d-head .navbtns{margin-left:auto;display:flex;gap:6px;}
  .d-head .navbtns button{
    border:none;background:var(--gray-100);color:var(--gray-700);font-weight:700;font-size:12.5px;
    padding:8px 12px;border-radius:9px;cursor:pointer;
  }
  .d-head .navbtns button:hover{background:#E8EBEE;}

  .section-title{font-size:13.5px;font-weight:800;color:var(--gray-900);margin:20px 0 9px;}
  .section-sub{font-size:11.5px;color:var(--gray-500);margin:-6px 0 9px;font-weight:500;}

  .chip-group{display:flex;flex-wrap:wrap;gap:7px;}
  .chip{
    border:none;background:var(--gray-100);border-radius:20px;padding:8px 13px;font-size:12.5px;
    font-weight:600;cursor:pointer;color:var(--gray-700);user-select:none;
  }
  .chip.on{background:var(--blue);color:#fff;}
  .chip.type-chip.on{background:var(--gray-900);color:#fff;}

  .career-card{
    background:var(--gray-50);border-radius:14px;padding:12px 14px;margin-bottom:8px;
  }
  .career-card.on{background:var(--blue-tint);}
  .career-toggle{
    display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:700;color:var(--gray-900);cursor:pointer;
  }
  .career-toggle input[type=checkbox]{width:18px;height:18px;accent-color:var(--blue);}
  .career-base{
    margin-top:10px;font-size:12.5px;color:var(--gray-700);line-height:1.65;font-weight:500;
    background:var(--white);border-radius:10px;padding:10px 12px;
  }
  .career-note{
    width:100%;margin-top:8px;border:none;background:var(--white);border-radius:10px;
    padding:10px 12px;font-family:inherit;font-size:13px;min-height:40px;resize:vertical;font-weight:500;
  }
  .career-note:focus{outline:2px solid var(--blue);}
  .extra-note{
    width:100%;border:none;background:var(--gray-100);border-radius:12px;
    padding:11px 13px;font-family:inherit;font-size:13.5px;min-height:56px;resize:vertical;font-weight:500;
  }
  .extra-note:focus{outline:2px solid var(--blue-tint);background:var(--white);box-shadow:inset 0 0 0 1.5px var(--blue);}

  .gen-actions{display:flex;gap:8px;margin:20px 0 10px;flex-wrap:wrap;}
  .gen-actions button{
    border:none;border-radius:12px;padding:12px 16px;font-size:13.5px;font-weight:800;cursor:pointer;
  }
  .btn-generate{background:var(--gray-900);color:#fff;flex:1;min-width:140px;}
  .btn-generate:hover{background:#333;}
  .btn-save{background:var(--blue);color:#fff;flex:1;min-width:100px;}
  .btn-save:hover{background:var(--blue-dark);}
  .btn-next{background:var(--gray-100);color:var(--gray-700);}
  .btn-next:hover{background:#E8EBEE;}

  .preview-box{background:var(--blue-tint);border-radius:var(--radius-lg);padding:16px;margin-top:6px;}
  .preview-box textarea{
    width:100%;min-height:150px;border:none;border-radius:12px;background:var(--white);
    padding:14px;font-family:inherit;font-size:13.5px;line-height:1.75;color:var(--gray-900);resize:vertical;font-weight:500;
  }
  .preview-box textarea:focus{outline:2px solid var(--blue);}
  .preview-foot{display:flex;align-items:center;gap:10px;margin-top:9px;flex-wrap:wrap;}
  .len-pill{font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:20px;}
  .len-ok{background:var(--green-tint);color:#00A661;}
  .len-warn{background:var(--orange-tint);color:var(--orange);}
  .len-bad{background:var(--red-tint);color:var(--red);}
  .saved-pill{font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:20px;background:var(--gray-100);color:var(--gray-500);}
  .saved-pill.on{background:var(--green-tint);color:#00A661;}

  .dup-banner{
    margin-top:10px;background:var(--orange-tint);color:#9A5B00;border-radius:12px;padding:11px 14px;
    font-size:12.5px;font-weight:600;line-height:1.6;
  }

  .empty-check-hint{font-size:12px;color:var(--gray-500);padding:10px 0;}

  /* ---------- modal / toast ---------- */
  .modal-back{position:fixed;inset:0;background:rgba(25,31,40,0.45);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px;}
  .modal{background:var(--white);border-radius:var(--radius-lg);padding:24px;width:min(480px,100%);max-height:80vh;overflow-y:auto;box-shadow:var(--shadow-pop);}
  .modal h3{margin:0 0 8px;font-size:17px;font-weight:800;}
  .modal p{font-size:13px;color:var(--gray-500);margin:0 0 14px;line-height:1.7;font-weight:500;}
  .modal textarea{width:100%;min-height:160px;border:none;background:var(--gray-100);border-radius:12px;padding:12px;font-family:inherit;font-size:12.5px;}
  .modal input[type=file]{width:100%;}
  .modal-actions{display:flex;gap:8px;margin-top:16px;justify-content:flex-end;}
  .modal-actions button{border:none;border-radius:10px;padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer;background:var(--gray-100);color:var(--gray-700);}
  .modal-actions .primary{background:var(--blue);color:#fff;}
  .hint{font-size:11.5px;color:var(--gray-500);margin-top:6px;line-height:1.6;font-weight:500;}
</style>

<div class="app" id="app">
  <div class="topbar">
    <div class="brand">
      <span class="tag">PE REPORT</span>
      <h1>체육 교과세특 도우미</h1>
      <span class="sub">체크만 하면 생기부 문체로 문장을 만들어드려요</span>
    </div>
    <span class="progress-pill" id="progressPill">0 / 0명 완료</span>
    <button class="btn-ghost" id="importBtn">명단 불러오기</button>
    <button class="btn-ghost" id="dupCheckBtn">전체 중복 검사</button>
    <button class="btn-primary" id="exportBtn">CSV로 내보내기</button>
  </div>

  <div class="main">
    <div class="panel">
      <div class="roster-head">
        <input type="text" id="searchInput" placeholder="이름 또는 반·번호 검색" />
        <button class="btn-ghost" id="addOneBtn" style="white-space:nowrap;">+ 학생</button>
      </div>
      <div class="roster-list" id="rosterList"></div>
    </div>
    <div class="panel">
      <div class="detail" id="detailPanel"></div>
    </div>
  </div>
</div>
<div id="modalRoot"></div>

  // ==================================================================
  // 2. 문장 조립 유틸 (조사 자동 처리 + 절 연결)
  // ==================================================================
  function pickRandom(arr){
    if(!arr || arr.length===0) return '';
    return arr[Math.floor(Math.random()*arr.length)];
  }
  function softenEnding(text){
    if(text.endsWith('있음')) return text.slice(0,-2)+'있으며';
    if(text.endsWith('함')) return text.slice(0,-1)+'하며';
    if(text.endsWith('임')) return text.slice(0,-1)+'이며';
    if(text.endsWith('됨')) return text.slice(0,-1)+'되며';
    if(text.endsWith('힘')) return text.slice(0,-1)+'히며';
    if(text.endsWith('름')) return text.slice(0,-1)+'르며';
    if(text.endsWith('남')) return text.slice(0,-1)+'나며';
    if(text.endsWith('음')) return text.slice(0,-1)+'으며';
    return text+',';
  }
  function joinOneSentence(clauses){
    const filtered = (clauses||[]).filter(c=>c && String(c).trim());
    if(filtered.length===0) return '';
    const softened = filtered.map((c,idx)=> idx<filtered.length-1? softenEnding(c): c);
    let sentence = softened.join(' ');
    if(!/[.!?]$/.test(sentence)) sentence += '.';
    return sentence;
  }

  // ==================================================================
  // 3. 문장 생성 (건강관리 → 배드민턴 → 롱보드 → 태도/성장 → 건강관리 역량 정리)
  // ==================================================================
  function generateFullText(s){
    const paragraphs = [];

    if(s.type && TYPE_PHRASES[s.type]){
      paragraphs.push(joinOneSentence([pickRandom(TYPE_PHRASES[s.type])]));
    }

    const healthClauses = (s.health||[]).map(item => pickRandom(HEALTH_PHRASES[item])).filter(Boolean);
    if(healthClauses.length){
      paragraphs.push(`건강 관리 영역에서는 ${joinOneSentence(healthClauses)}`);
    }

    const butterrunClauses = (s.butterrun||[]).map(item => pickRandom(BUTTERRUN_PHRASES[item])).filter(Boolean);
    if(butterrunClauses.length){
      paragraphs.push(`버터런 융합 탐구 활동을 통해 ${joinOneSentence(butterrunClauses)}`);
    }

    const bdClauses = (s.badminton||[]).map(item => pickRandom(BADMINTON_PHRASES[item])).filter(Boolean);
    if(bdClauses.length){
      paragraphs.push(`전략형 스포츠인 배드민턴 활동에서는 ${joinOneSentence(bdClauses)}`);
    }

    const lbClauses = (s.longboard||[]).map(item => pickRandom(LONGBOARD_PHRASES[item])).filter(Boolean);
    if(lbClauses.length){
      paragraphs.push(`생태형 스포츠인 롱보드 활동에서는 ${joinOneSentence(lbClauses)}`);
    }

    // 주요이력 문단 - 체크된 이력의 기본 문구 + 학생별 추가 입력을 자연스럽게 이어붙임
    const careerParts = [];
    if(s.careerCaptain){
      let base = CAREER_DEFAULTS.captain;
      if(s.careerCaptainNote && s.careerCaptainNote.trim()){
        base = base.replace(/\.$/, '') + '. ' + ensureSentence(s.careerCaptainNote.trim());
      }
      careerParts.push(base);
    }
    if(s.careerPaps){
      let base = CAREER_DEFAULTS.paps1;
      if(s.careerPapsNote && s.careerPapsNote.trim()){
        base = base.replace(/\.$/, '') + '. ' + ensureSentence(s.careerPapsNote.trim());
      }
      careerParts.push(base);
    }
    if(s.careerPerfect){
      let base = CAREER_DEFAULTS.perfect;
      if(s.careerPerfectNote && s.careerPerfectNote.trim()){
        base = base.replace(/\.$/, '') + '. ' + ensureSentence(s.careerPerfectNote.trim());
      }
      careerParts.push(base);
    }
    if(careerParts.length){
      paragraphs.push(careerParts.join(' '));
    }

    const atClauses = (s.attitude||[]).map(item => pickRandom(ATTITUDE_PHRASES[item])).filter(Boolean);

    // 추가 특이사항(수기) - 태도/성장 문단에 자연스럽게 합쳐지고, 태도 선택이 없으면 단독 문장으로 들어감
    const extraNote = (s.extraNote||'').trim();
    if(atClauses.length && extraNote){
      const noteClause = extraNote.replace(/[.。]\s*$/, '');
      paragraphs.push(`전반적으로 ${joinOneSentence([...atClauses, noteClause])}`);
    } else if(atClauses.length){
      paragraphs.push(`전반적으로 ${joinOneSentence(atClauses)}`);
    } else if(extraNote){
      paragraphs.push(ensureSentence(extraNote));
    }

    if(paragraphs.length > 0){
      paragraphs.push(joinOneSentence([pickRandom(CLOSING_PHRASES)]));
    }

    return paragraphs.join(' ');
  }

  function ensureSentence(text){
    let t = String(text||'').trim();
    if(!t) return '';
    if(!/[.!?。]$/.test(t)) t += '.';
    return t;
  }

    const lines = [];
    if(s.type) lines.push(`- 학생 유형: ${s.type}`);

    if(s.attitude && s.attitude.length) lines.push(`- 태도 특징: ${s.attitude.join(', ')}`);
    if(s.careerCaptain){

    }

    }
    if(s.careerPerfect){
      lines.push(`- 주요 이력(수행평가 우수): "${CAREER_DEFAULTS.perfect}" 이 내용을 반드시 포함${s.careerPerfectNote && s.careerPerfectNote.trim()? `. 추가 관찰: ${s.careerPerfectNote.trim()}` : ''}`);
    }
    if(s.extraNote && s.extraNote.trim()) lines.push(`- 교사가 관찰한 추가 특이사항: ${s.extraNote.trim()}`);

  async function generateWithAI(s){

    const prompt = `당신은 20년 경력의 고등학교 체육 교사로, 학교생활기록부 교과 세부능력 및 특기사항(세특)을 작성합니다.

  // ==================================================================
  // 4. 중복(유사) 문장 감지 - 바이그램 다이스 계수
  // ==================================================================
  function bigrams(str){
    const s = String(str||'').replace(/\s+/g,'');
    const grams = [];
    for(let i=0;i<s.length-1;i++) grams.push(s.slice(i,i+2));
    return grams;
  }
  function diceSimilarity(a,b){
    const ga = bigrams(a), gb = bigrams(b);
    if(ga.length===0 || gb.length===0) return 0;
    const mapB = {};
    gb.forEach(g=>{ mapB[g] = (mapB[g]||0)+1; });
    let matches = 0;
    ga.forEach(g=>{
      if(mapB[g] > 0){ matches++; mapB[g]--; }
    });
    return (2*matches) / (ga.length + gb.length);
  }
  const DUP_THRESHOLD = 0.72;

  function checkDuplicateForStudent(target){
    if(!target.text || !target.text.trim()){ target.dupWarning = null; return; }
    let best = null;
    students.forEach(other=>{
      if(other.id === target.id) return;
      if(!other.text || !other.text.trim()) return;
      const score = diceSimilarity(target.text, other.text);
      if(score >= DUP_THRESHOLD && (!best || score > best.score)){
        best = {withId: other.id, withName: other.name, score};
      }
    });
    target.dupWarning = best;
  }

  function checkAllDuplicates(){
    students.forEach(s=>{ s.dupWarning = null; });
    for(let i=0;i<students.length;i++){
      for(let j=i+1;j<students.length;j++){
        const a = students[i], b = students[j];
        if(!a.text || !a.text.trim() || !b.text || !b.text.trim()) continue;
        const score = diceSimilarity(a.text, b.text);
        if(score >= DUP_THRESHOLD){
          if(!a.dupWarning || score > a.dupWarning.score) a.dupWarning = {withId:b.id, withName:b.name, score};
          if(!b.dupWarning || score > b.dupWarning.score) b.dupWarning = {withId:a.id, withName:a.name, score};
        }
      }
    }
  }

  // ==================================================================
  let students = [];

  function uid(){ return 's'+Math.random().toString(36).slice(2,10); }

      id: uid(),
      ban: ban||'', number: number||'', name: name||'',
      type:'', health:[], butterrun:[], badminton:[], longboard:[], attitude:[],
      careerCaptain:false, careerCaptainNote:'',
      careerPaps:false, careerPapsNote:'',
      careerPerfect:false, careerPerfectNote:'',
      extraNote:'',
      text:'', saved:false, dupWarning:null
    };
  }

  // ---------------- Firestore 저장 레이어 ----------------
  // 학생 1명 = 문서 1개 구조라서, 서로 다른 학생을 편집하는 교사끼리는 절대 충돌하지 않음.
  let db = null;
  let unsubscribeStudents = null;
  const dirtyIds = new Set(); // 아직 서버에 저장되지 않은 로컬 변경분
  let flushTimer = null;

  function cleanStudentForSave(s){
    return {
      ban: s.ban||'', number: s.number||'', name: s.name||'',
      type: s.type||'', health: s.health||[], butterrun: s.butterrun||[], badminton: s.badminton||[],
      longboard: s.longboard||[], attitude: s.attitude||[],
      careerCaptain: !!s.careerCaptain, careerCaptainNote: s.careerCaptainNote||'',
      careerPaps: !!s.careerPaps, careerPapsNote: s.careerPapsNote||'',
      careerPerfect: !!s.careerPerfect, careerPerfectNote: s.careerPerfectNote||'',
      extraNote: s.extraNote||'',
      text: s.text||'', saved: !!s.saved,
      updatedAt: Date.now()
    };
  }

  // student를 넘기면 그 학생만 dirty로 표시하고, 잠시 후 일괄 저장
  function scheduleSave(student){
    if(student && student.id) dirtyIds.add(student.id);
    clearTimeout(flushTimer);
    flushTimer = setTimeout(flushDirty, 500);
  }

  async function flushDirty(){
    if(!db || dirtyIds.size===0) return;
    const ids = Array.from(dirtyIds);
    const chunks = [];
    for(let i=0;i<ids.length;i+=400) chunks.push(ids.slice(i,i+400));
    for(const chunk of chunks){
      const batch = db.batch();
      let hasAny = false;
      chunk.forEach(id=>{
        const s = students.find(x=>x.id===id);
        if(s){ batch.set(db.collection(COLLECTION).doc(id), cleanStudentForSave(s)); hasAny = true; }
      });
      if(!hasAny){ chunk.forEach(id=>dirtyIds.delete(id)); continue; }
      try{
        await batch.commit();
        chunk.forEach(id=>dirtyIds.delete(id));
      }catch(e){
        console.error('저장 실패', e);
        showToast('저장에 실패했어요. 네트워크를 확인해주세요.');
      }
    }
  }

  async function deleteStudentRemote(id){
    if(!db) return;
    try{ await db.collection(COLLECTION).doc(id).delete(); }
    catch(e){ console.error('삭제 실패', e); showToast('삭제에 실패했어요.'); }
  }

  // 실시간 구독 - 다른 교사가 저장하면 내 화면에도 바로 반영됨
  function subscribeStudents(){
    unsubscribeStudents = db.collection(COLLECTION).onSnapshot(snap=>{
      const remote = [];
      snap.forEach(doc=>{
        remote.push(Object.assign({id: doc.id, dupWarning: null}, doc.data()));
      });
      // 아직 저장 안 된 내 변경분(dirty)은 서버 데이터로 덮어쓰지 않음
      const merged = remote.map(r=>{
        if(dirtyIds.has(r.id)){
          const local = students.find(x=>x.id===r.id);
          return local || r;
        }
        return r;
      });
      // 방금 추가해서 아직 서버에 없는 학생 유지
      students.filter(x=>dirtyIds.has(x.id) && !merged.find(m=>m.id===x.id)).forEach(x=>merged.push(x));
      students = merged;
      // 텍스트 입력 중이면 상세 화면은 다시 그리지 않음 (커서 유지)
      const typing = document.activeElement && (document.activeElement.tagName==='TEXTAREA' || document.activeElement.tagName==='INPUT');
      renderProgress();
      renderRoster();
      if(!typing) renderDetail();
    }, err=>{
      console.error('실시간 연결 오류', err);
      showToast('서버 연결에 문제가 생겼어요. 새로고침해보세요.');
    });
  }

    if(typeof firebase === 'undefined'){
      detailPanel.innerHTML = `<div class="detail-empty">Firebase 스크립트를 불러오지 못했어요.<br>이 파일은 GitHub Pages에 올려서 실행해주세요.</div>`;

  // ==================================================================
  // 6. CSV 파싱 / 내보내기
  // ==================================================================
  function parseCSV(text){
    const rows = [];
    let row = [], field = '', inQuotes = false;
    for(let i=0;i<text.length;i++){
      const c = text[i];
      if(inQuotes){
        if(c === '"'){
          if(text[i+1] === '"'){ field += '"'; i++; }
          else inQuotes = false;
        } else field += c;
      } else {
        if(c === '"') inQuotes = true;
        else if(c === ','){ row.push(field); field=''; }
        else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
        else if(c === '\r'){ /* skip */ }
        else field += c;
      }
    }
    if(field.length>0 || row.length>0){ row.push(field); rows.push(row); }
    return rows.filter(r=> r.some(c=>String(c).trim()!==''));
  }

  function toCSVText(rows){
    const body = rows.map(row => row.map(cell=>{
      const v = String(cell==null? '': cell);
      if(/[",\n]/.test(v)) return '"' + v.replace(/"/g,'""') + '"';
      return v;
    }).join(',')).join('\r\n');
    return '\uFEFF' + body; // 엑셀 한글 호환을 위한 BOM
  }

  function downloadCSV(filename, rows){
    const blob = new Blob([toCSVText(rows)], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function detectColumns(headerRow){
    const idx = {};
    (headerRow||[]).forEach((h,i)=>{
      const label = String(h==null? '': h).trim();
      if(!label) return;
      if(idx.ban===undefined && /(반|학반|학급)/.test(label)) idx.ban = i;
      else if(idx.number===undefined && /(번호|학번)/.test(label)) idx.number = i;
      else if(idx.name===undefined && /(이름|성명)/.test(label)) idx.name = i;
    });
    return idx;
  }

  function importRows(rows){
    if(!rows || rows.length < 2){
      showToast('인식할 수 있는 데이터가 없어요.');
      return;
    }
    const idx = detectColumns(rows[0]);
    if(idx.name===undefined){
      showToast('이름(성명) 열을 찾지 못했어요. 헤더에 "이름"이 포함되어야 해요.');
      return;
    }
    let added = 0, skipped = 0;
    for(let r=1;r<rows.length;r++){
      const row = rows[r] || [];
      const name = String(idx.name!==undefined? (row[idx.name]||'') : '').trim();
      if(!name){ skipped++; continue; }
      const ban = idx.ban!==undefined? String(row[idx.ban]||'').trim() : '';
      const number = idx.number!==undefined? String(row[idx.number]||'').trim() : '';
      const ns = blankStudent(ban, number, name);
      students.push(ns);
      dirtyIds.add(ns.id);
      added++;
    }
    scheduleSave();
    closeModal();
    render();
    showToast(`${added}명을 추가했어요.${skipped? ' ('+skipped+'행은 이름이 없어 건너뜀)':''}`);
  }

  function importCSVText(text){
    importRows(parseCSV(text));
  }

  function importExcelFile(file){
    if(typeof XLSX === 'undefined'){
      showToast('엑셀 라이브러리를 불러오는 중입니다. 잠시 후 다시 시도해주세요.');
      return;
    }
    const reader = new FileReader();
    reader.onload = (ev)=>{
      try{
        const data = new Uint8Array(ev.target.result);
        const wb = XLSX.read(data, {type:'array'});
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, {header:1, defval:''});
        importRows(rows);
      }catch(err){
        showToast('엑셀 파일을 읽는 중 문제가 발생했어요: ' + err.message);
      }
    };
    reader.readAsArrayBuffer(file);
  }

  function exportResultsCSV(){
    const header = ['학번','반','번호','이름','완료여부','글자수','세부능력특기사항'];
    const rows = [header];
    sortedStudents().forEach(s=>{
      rows.push([studentIdOf(s), s.ban, s.number, s.name, s.saved? '완료':'미완료', String((s.text||'').length), s.text||'']);
    });
    downloadCSV('체육1_세특_결과.csv', rows);
  }

  // ==================================================================
  // 7. 정렬 / 검색
  // ==================================================================
  function sortedStudents(){
    return students.slice().sort((a,b)=>{
      const ba = parseInt(a.ban,10), bb = parseInt(b.ban,10);
      if(!isNaN(ba) && !isNaN(bb) && ba!==bb) return ba-bb;
      if(a.ban !== b.ban) return String(a.ban).localeCompare(String(b.ban));
      const na = parseInt(a.number,10), nb = parseInt(b.number,10);
      if(!isNaN(na) && !isNaN(nb)) return na-nb;
      return String(a.number).localeCompare(String(b.number));
    });
  }

  // "1반 1번" -> "10101" 형태 학번 (1학년 고정, 반 2자리 + 번호 2자리)
  const GRADE = '1';
  function studentIdOf(s){
    const ban = parseInt(s.ban, 10);
    const num = parseInt(s.number, 10);
    if(isNaN(ban) || isNaN(num)) return '';
    return `${GRADE}${String(ban).padStart(2,'0')}${String(num).padStart(2,'0')}`;
  }

  // 8. 토스트 / 커스텀 확인창 (iframe 환경에서 alert/confirm이 막힐 수 있어 자체 구현)

  function showToast(message){

      toast = document.createElement('div');
      toast.id = 'appToast';
      toast.style.cssText = 'position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#191F28;color:#fff;padding:11px 18px;border-radius:12px;font-size:13px;font-weight:600;z-index:200;box-shadow:0 8px 28px rgba(0,0,0,0.25);opacity:0;transition:opacity .2s ease;max-width:80vw;text-align:center;';
      document.body.appendChild(toast);
    }
    toast.textContent = message;
    toast.style.opacity = '1';
    clearTimeout(toast._t);
    toast._t = setTimeout(()=>{ toast.style.opacity = '0'; }, 2600);
  }

          </div>

    document.getElementById('mConfirmBack').addEventListener('click', (e)=>{ if(e.target.id==='mConfirmBack') closeModal(); });
    document.getElementById('confirmCancelBtn').addEventListener('click', closeModal);
    document.getElementById('confirmOkBtn').addEventListener('click', ()=>{ closeModal(); onConfirm(); });
  }

  function escapeHtml(str){
    return (str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function escapeAttr(str){
    return (str||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;');
  }

  function rosterItemHtml(s){
    const warn = s.dupWarning ? `<span class="warn-badge" title="${escapeAttr(s.dupWarning.withName)} 학생과 유사">유사 ${Math.round(s.dupWarning.score*100)}%</span>` : '';

  function bindRosterItemEvents(){
    rosterList.querySelectorAll('.roster-item').forEach(el=>{
      el.addEventListener('click', ()=>{
        selectedId = el.getAttribute('data-id');
        renderDetail();
        renderRoster();

  function renderRoster(){
    const q = (searchInput.value||'').trim();
    if(students.length===0){
      rosterList.innerHTML = `<div class="roster-empty">아직 등록된 학생이 없어요.<br>'명단 불러오기' 또는 '+ 학생'으로 시작하세요.</div>`;
      return;
    }

    // 검색 중에는 그룹 없이 전체 검색 결과를 학번순으로 표시
    if(q){
      const list = sortedStudents().filter(s =>
        (s.name||'').includes(q) || studentIdOf(s).includes(q) || ((s.ban||'')+(s.number||'')).includes(q)
      );
      if(list.length===0){
        rosterList.innerHTML = `<div class="roster-empty">검색 결과가 없어요.</div>`;
        return;
      }
      rosterList.innerHTML = list.map(rosterItemHtml).join('');
      bindRosterItemEvents();
      return;
    }

    // 반별 그룹화 (그룹 안에서는 번호순 = 학번순)
    const groups = {};
    sortedStudents().forEach(s=>{
      const key = (s.ban && String(s.ban).trim()) ? String(s.ban).trim() : '미분류';
      (groups[key] = groups[key] || []).push(s);
    });
    const groupKeys = Object.keys(groups).sort((a,b)=>{
      if(a==='미분류') return 1;
      if(b==='미분류') return -1;
      const na = parseInt(a,10), nb = parseInt(b,10);
      if(!isNaN(na) && !isNaN(nb)) return na-nb;
      return a.localeCompare(b);
    });

    rosterList.innerHTML = groupKeys.map(key=>{
      const list = groups[key];
      const doneCount = list.filter(s=>s.saved).length;
      const expanded = expandedGroups.has(key);
      return `<div class="group">
        <div class="group-head" data-group="${escapeAttr(key)}">
          <span class="group-arrow">${expanded?'▾':'▸'}</span>
          <span class="group-title">${key==='미분류'? '미분류' : key+'반'}</span>
          <span class="group-count">${doneCount}/${list.length}명 완료</span>
        </div>
        ${expanded? `<div class="group-body">${list.map(rosterItemHtml).join('')}</div>` : ''}
      </div>`;
    }).join('');

    bindRosterItemEvents();

    rosterList.querySelectorAll('.group-head').forEach(el=>{
      el.addEventListener('click', ()=>{
        const key = el.getAttribute('data-group');
        if(expandedGroups.has(key)) expandedGroups.delete(key); else expandedGroups.add(key);
        renderRoster();
      });
    });
  }

  function chipGroupHtml(category, items, selectedArr, extraClass){

      <div class="section-title">롱보드 특징</div>
      <div class="section-sub">균형 유지 · 주행 · 카빙 · 코스 수행 · 안전수칙</div>
      <div class="chip-group" id="lbChips">${chipGroupHtml('longboard', LONGBOARD_ITEMS, s.longboard)}</div>

      <div class="section-title">태도 특징</div>
      <div class="chip-group" id="atChips">${chipGroupHtml('attitude', ATTITUDE_ITEMS, s.attitude)}</div>

      <div class="section-title">주요 이력</div>
      <div class="section-sub">체크하면 기본 문구가 들어가고, 그 학생만의 내용을 덧붙일 수 있어요</div>

      <div class="career-card ${s.careerCaptain?'on':''}">
        <label class="career-toggle">
          <input type="checkbox" data-career="careerCaptain" ${s.careerCaptain?'checked':''} />
          <span>체육부장</span>
        </label>
        ${s.careerCaptain? `
        <div class="career-base">${escapeHtml(CAREER_DEFAULTS.captain)}</div>
        <textarea class="career-note" data-careernote="careerCaptainNote" placeholder="추가 내용 입력 (예: 경기 진행 시 심판 역할을 자원함)">${escapeHtml(s.careerCaptainNote)}</textarea>
        ` : ''}
      </div>

      <div class="career-card ${s.careerPaps?'on':''}">
        <label class="career-toggle">
          <input type="checkbox" data-career="careerPaps" ${s.careerPaps?'checked':''} />
          <span>PAPS 1등급</span>
        </label>
        ${s.careerPaps? `
        <div class="career-base">${escapeHtml(CAREER_DEFAULTS.paps1)}</div>
        <textarea class="career-note" data-careernote="careerPapsNote" placeholder="추가 내용 입력 (예: 특히 심폐지구력 영역에서 뛰어난 기록을 보임)">${escapeHtml(s.careerPapsNote)}</textarea>
        ` : ''}
      </div>

      <div class="career-card ${s.careerPerfect?'on':''}">
        <label class="career-toggle">
          <input type="checkbox" data-career="careerPerfect" ${s.careerPerfect?'checked':''} />
          <span>수행평가 만점(우수)</span>
        </label>
        ${s.careerPerfect? `
        <div class="career-base">${escapeHtml(CAREER_DEFAULTS.perfect)}</div>
        <textarea class="career-note" data-careernote="careerPerfectNote" placeholder="추가 내용 입력 (예: 배드민턴 서브 수행평가에서 전 회차 성공함)">${escapeHtml(s.careerPerfectNote)}</textarea>
        ` : ''}
      </div>

      <div class="section-title">추가 특이사항 (수기 입력)</div>
      <div class="section-sub">관찰한 특이점을 적으면 태도·성장 문단에 자연스럽게 녹여서 넣어드려요</div>
      <textarea class="extra-note" data-extranote placeholder="예: 부상당한 친구의 활동을 대신 도와주는 배려심을 보임">${escapeHtml(s.extraNote)}</textarea>

      <div class="gen-actions">
        <button class="btn-generate" id="generateBtn">✨ AI 문장 생성</button>
        <button class="btn-save" id="saveBtn">저장</button>
      </div>

      <div class="preview-box">
        <textarea id="finalText" placeholder="위 항목을 체크한 뒤 '문장 생성'을 눌러주세요.">${escapeHtml(s.text)}</textarea>
        <div class="preview-foot">
          ${lenPillHtml(len)}
        </div>
        ${s.dupWarning ? `<div class="dup-banner">⚠ 이 문장은 <b>${escapeHtml(s.dupWarning.withName)}</b> 학생과 약 ${Math.round(s.dupWarning.score*100)}% 유사해요. 표현을 조금 바꿔보는 걸 추천해요.</div>` : ''}
      </div>
    `;

    // ---- 이벤트 바인딩 ----
    detailPanel.querySelectorAll('.chip').forEach(el=>{
      el.addEventListener('click', ()=>{
        const cat = el.getAttribute('data-cat');
        const item = el.getAttribute('data-item');
        if(cat === 'type'){
          s.type = (s.type === item) ? '' : item;
        } else {
          const arr = s[cat] || (s[cat]=[]);
          const idx = arr.indexOf(item);
          if(idx>=0) arr.splice(idx,1); else arr.push(item);
        }
        scheduleSave(s);
        renderDetail();
      });
    });

    // 주요이력 체크박스
    detailPanel.querySelectorAll('[data-career]').forEach(el=>{
      el.addEventListener('change', ()=>{
        s[el.getAttribute('data-career')] = el.checked;
        scheduleSave(s);
        renderDetail();
      });
    });
    // 주요이력 추가 입력 (입력 중에는 리렌더링하지 않아 커서가 유지됨)
    detailPanel.querySelectorAll('[data-careernote]').forEach(el=>{
      el.addEventListener('input', ()=>{
        s[el.getAttribute('data-careernote')] = el.value;
        scheduleSave(s);
      });
    });
    // 추가 특이사항 (수기)
    const extraNoteEl = detailPanel.querySelector('[data-extranote]');
    if(extraNoteEl){
      extraNoteEl.addEventListener('input', ()=>{
        s.extraNote = extraNoteEl.value;
        scheduleSave(s);
      });
    }

    const generateBtn = detailPanel.querySelector('#generateBtn');
    generateBtn.addEventListener('click', async ()=>{
      const hasAny = s.type || (s.health&&s.health.length) || (s.badminton&&s.badminton.length) || (s.longboard&&s.longboard.length) || (s.attitude&&s.attitude.length)
        || s.careerCaptain || s.careerPaps || s.careerPerfect || (s.extraNote && s.extraNote.trim());
      if(!hasAny){
        showToast('먼저 특징을 하나 이상 선택해주세요.');
        return;
      }
      // 로딩 상태
      generateBtn.disabled = true;
      generateBtn.textContent = 'AI가 작성 중...';
      const targetId = s.id; // 생성 중 다른 학생으로 이동해도 올바른 학생에게 저장되도록
      try{
        const aiText = await generateWithAI(s);
        const target = students.find(x=>x.id===targetId);
        if(target){
          target.text = aiText;
          target.saved = false;
          checkDuplicateForStudent(target);
          scheduleSave(target);
        }
      }catch(err){
        console.error('AI 생성 실패, 규칙 기반으로 대체:', err);
        const target = students.find(x=>x.id===targetId);
        if(target){
          target.text = generateFullText(target);
          target.saved = false;
          checkDuplicateForStudent(target);
          scheduleSave(target);
        }
        showToast('AI 생성에 실패해 기본 방식으로 작성했어요. 다시 시도해보세요.');
      }
      // 여전히 같은 학생을 보고 있을 때만 화면 갱신
      if(selectedId === targetId){
        renderDetail();
      }
      renderRoster();
    });

    const finalTextEl = detailPanel.querySelector('#finalText');
    finalTextEl.addEventListener('input', ()=>{
      s.text = finalTextEl.value;
      s.saved = false;
      scheduleSave(s);
      const foot = detailPanel.querySelector('.preview-foot');
      if(foot) foot.innerHTML = lenPillHtml(s.text.length);
      renderRoster();
    });

    detailPanel.querySelector('#saveBtn').addEventListener('click', ()=>{
      if(!s.text || !s.text.trim()){
        showToast('저장할 문구가 없어요. 먼저 문장을 생성해주세요.');
        return;
      }
      s.saved = true;
      checkDuplicateForStudent(s);
      // 상대방 쪽 배지도 갱신
      if(s.dupWarning){
        const other = students.find(x=>x.id===s.dupWarning.withId);
        if(other) checkDuplicateForStudent(other);
      }
      scheduleSave(s);
      render();
      showToast('저장했어요.');
    });

    detailPanel.querySelector('#prevBtn').addEventListener('click', ()=> moveStudent(-1));
    detailPanel.querySelector('#nextBtn').addEventListener('click', ()=> moveStudent(1));

    detailPanel.querySelector('#delBtn').addEventListener('click', ()=>{
      showConfirm(`${s.name||'이 학생'} 정보를 삭제할까요?`, ()=>{
        students = students.filter(x=>x.id!==s.id);
        selectedId = null;
        dirtyIds.delete(s.id);
        deleteStudentRemote(s.id);
        render();
      });
    });
  }

  function moveStudent(delta){
    const list = sortedStudents();
    const idx = list.findIndex(x=>x.id===selectedId);
    if(idx===-1){
      if(list.length>0){ selectedId = list[0].id; renderDetail(); renderRoster(); }
      return;
    }
    const nextIdx = idx + delta;
    if(nextIdx < 0){ showToast('첫 번째 학생이에요.'); return; }
    if(nextIdx >= list.length){ showToast('마지막 학생이에요.'); return; }
    selectedId = list[nextIdx].id;
    renderDetail();
    renderRoster();
  }

  // ==================================================================
  // 10. 상단 버튼 & 모달
  // ==================================================================
  document.getElementById('addOneBtn').addEventListener('click', ()=>{
    const s = blankStudent('', '', '');
    students.push(s);
    selectedId = s.id;
    scheduleSave(s);
    render();
  });

  document.getElementById('exportBtn').addEventListener('click', exportResultsCSV);

  document.getElementById('dupCheckBtn').addEventListener('click', ()=>{
    checkAllDuplicates();
    render();
    const count = students.filter(s=>s.dupWarning).length;
    showToast(count>0? `${count}명에게서 유사 문장이 발견됐어요.` : '유사한 문장이 없어요.');
  });

  document.getElementById('searchInput').addEventListener('input', renderRoster);

  document.getElementById('importBtn').addEventListener('click', openImportModal);

  function openImportModal(){
    let pendingFile = null;
    modalRoot.innerHTML = `
      <div class="modal-back" id="mBack">
        <div class="modal">
          <h3>명단 불러오기</h3>
          <p>헤더에 <b>반</b>, <b>번호</b>, <b>이름</b>이 포함된 엑셀(.xlsx, .xls) 또는 CSV 파일을 올려주세요.</p>
          <div class="field">
            <input type="file" id="rosterFileInput" accept=".xlsx,.xls,.csv,text/csv" />
          </div>
          <div class="modal-actions" style="justify-content:flex-start;margin-top:10px;">
            <button class="primary" id="confirmFileImport">파일로 불러오기</button>
          </div>

          <div class="hint" style="margin:18px 0 4px;border-top:1px solid var(--gray-100);padding-top:14px;">또는 표 내용을 직접 붙여넣으세요. (엑셀에서 복사해서 붙여넣어도 돼요)</div>
          <textarea id="csvPasteArea" placeholder="반,번호,이름&#10;1,1,김OO&#10;1,2,이OO"></textarea>
          <div class="modal-actions">
            <button id="cancelImport">취소</button>
            <button class="primary" id="confirmPasteImport">붙여넣은 내용 추가하기</button>
          </div>
        </div>
      </div>`;
    document.getElementById('cancelImport').addEventListener('click', closeModal);
    document.getElementById('mBack').addEventListener('click', (e)=>{ if(e.target.id==='mBack') closeModal(); });

    document.getElementById('rosterFileInput').addEventListener('change', (e)=>{
      pendingFile = (e.target.files && e.target.files[0]) || null;
    });
    document.getElementById('confirmFileImport').addEventListener('click', ()=>{
      if(!pendingFile){
        showToast('먼저 파일을 선택해주세요.');
        return;
      }
      const isExcel = /\.(xlsx|xls)$/i.test(pendingFile.name);
      if(isExcel){
        importExcelFile(pendingFile);
      } else {
        const reader = new FileReader();
        reader.onload = (ev)=> importCSVText(String(ev.target.result));
        reader.onerror = ()=> showToast('파일을 읽는 중 문제가 발생했어요.');
        reader.readAsText(pendingFile, 'utf-8');
      }
    });

    document.getElementById('confirmPasteImport').addEventListener('click', ()=>{
      const text = document.getElementById('csvPasteArea').value;
      if(!text.trim()){ showToast('붙여넣은 내용이 없어요.'); return; }
      importCSVText(text);
    });
  }

  render();
  initApp();
})();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
